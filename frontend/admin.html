<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanGwalior - Admin Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0px 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #27ae60; color: white; font-weight: 600; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-reported { background-color: #ffeaa7; color: #d63031; }
        .status-cleaned { background-color: #badc58; color: #6ab04c; }
        .action-btn { background-color: #2980b9; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; display: inline-block; }
        .action-btn:hover { background-color: #3498db; }
    </style>
    <script>
        async function fetchReports() {
            try {
                // Support both standard hostnames dynamically
                const baseUrl = window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:8000' : 'http://localhost:8000';
                const response = await fetch(`${baseUrl}/admin/reports`);
                const reports = await response.json();
                const tableBody = document.getElementById('reportTableBody');
                tableBody.innerHTML = ''; 

                reports.forEach(report => {
                    const row = document.createElement('tr');
                    
                    // Build elements visually to protect click triggers from string injection errors
                    const idCell = `<td>${report.report_id}</td>`;
                    const photoCell = `<td><a href="${baseUrl}/${report.image_path}" target="_blank">View Photo</a></td>`;
                    const landmarkCell = `<td>${report.address}</td>`;
                    const gpsCell = `<td>${report.latitude}, ${report.longitude}</td>`;
                    const statusCell = `<td><span class="status-badge status-${report.status}">${report.status}</span></td>`;
                    
                    let actionCell = '<td>✅</td>';
                    if (report.status !== 'cleaned') {
                        actionCell = `<td><button class="action-btn" data-id="${report.report_id}">Mark Cleaned</button></td>`;
                    }

                    row.innerHTML = idCell + photoCell + landmarkCell + gpsCell + statusCell + actionCell;
                    tableBody.appendChild(row);
                });

                // Attach robust event listeners to the action buttons cleanly
                document.querySelectorAll('.action-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const targetId = this.getAttribute('data-id');
                        markAsCleaned(targetId);
                    });
                });

            } catch (error) {
                console.error("Failed to load reports:", error);
            }
        }

        async function markAsCleaned(reportId) {
            try {
                const baseUrl = window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:8000' : 'http://localhost:8000';
                const response = await fetch(`${baseUrl}/report/${reportId}/status?status=cleaned`, {
                    method: 'PUT'
                });
                if (response.ok) {
                    alert("🎉 Database updated! Status changed to CLEANED.");
                    fetchReports(); 
                } else {
                    alert("Server rejected the request update.");
                }
            } catch (error) {
                console.error("Database connection fault:", error);
                alert("Failed to connect to backend server configuration.");
            }
        }

        window.onload = fetchReports;
    </script>
</head>
<body>
    <div class="container">
        <h2>Nagar Nigam Gwalior - Trash Complaints Dashboard</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Landmark Reference</th>
                    <th>GPS Coordinates</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <tr><td colspan="6" style="text-align:center;">Loading complaints database...</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
